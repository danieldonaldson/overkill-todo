# Per-path Cache-Control, computed here instead of with per-location `add_header`.
# nginx's add_header inheritance is REPLACE, not merge: a location that declares any
# add_header of its own silently drops every server-level one. A `location ~* \.html$`
# that set only Cache-Control therefore stripped CSP, Permissions-Policy and COOP from
# every HTML response — precisely the documents that need them. Keeping the security
# headers as the only server-level add_headers, and routing caching through this map,
# makes that regression structurally impossible. An empty value emits no header at all
# (nginx skips an add_header whose value evaluates to the empty string).
map $uri $app_cache_control {
    default                       "";
    "~^/_astro/"                  "public, immutable, max-age=31536000";
    "~*\.(?:woff2?|eot|ttf|otf)$" "public, immutable, max-age=31536000";
    "~*\.html$"                   "no-cache, no-store, must-revalidate";
    "~^/config\.js$"              "no-store";
}

server {
    # nginx-unprivileged listens on 8080 (non-root uid 101, no privileged port).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version in Server: / error pages.
    server_tokens off;

    # Emit relative redirects so nginx's automatic trailing-slash redirect (from
    # try_files $uri/) never builds an absolute Location using this block's listen
    # port, which would leak :8080 to the public behind the TLS-terminating edge.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS — only honoured by browsers over HTTPS, harmless on the internal hop to
    # the TLS-terminating edge.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # script-src drops 'unsafe-inline'. Our own inline scripts are externalised
    # to /scripts/*; the remaining inline scripts are Astro's island-hydration
    # bootstrap and props deserializer, pinned by SHA-256 hash below. If an Astro
    # upgrade changes either snippet, hydration breaks until the hashes are
    # regenerated from the built HTML (guarded by tests/csp.spec.ts).
    # static.cloudflareinsights.com serves the Web Analytics beacon that Cloudflare injects into
    # every HTML response at the edge.
    #
    # Allowed as a HOST, deliberately NOT as Cloudflare's documented
    # `https://static.cloudflareinsights.com/beacon.min.js` — that form does not work. The URL
    # actually served is `/beacon.min.js/v4513226c…`, i.e. the version is a further path
    # SEGMENT, and a CSP source expression whose path does not end in `/` must match the path
    # exactly. Verified in Chromium against all three candidates: the documented form is
    # BLOCKED; `…/beacon.min.js/` (prefix) and the bare host both work. Host-only is used here
    # because that host is single-purpose; tighten to the trailing-slash prefix if ever wanted.
    #
    # connect-src stays 'self': for edge-injected (rather than hand-embedded) beacons the RUM
    # payload POSTs to /cdn-cgi/rum on our own origin. If a connect-src violation ever appears
    # for this, the fix is to add https://cloudflareinsights.com — not to loosen anything else.
    # Any third-party embed (payment checkout, captcha, analytics) needs its own
    # script-src/connect-src/frame-src entries, and a CSP that's too tight fails
    # silently in production. Add an embed only together with a browser test that
    # drives it under this exact policy (see tests/csp.spec.ts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-QzWFZi+FLIx23tnm9SBU4aEgx4x8DsuASP07mfqol/c=' 'sha256-SaCkFfPruIdTXT8/97JArQmGxiJAL2o4bBDvSgJ5y3Q=' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Keep this the LAST add_header and the only one below: every add_header in this
    # server block must stay at this level (see the map comment above).
    add_header Cache-Control $app_cache_control always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Caching for hashed assets (/_astro/), @fontsource fonts and HTML is driven by the
    # $app_cache_control map above — deliberately NOT by per-location add_header.

    # Probe target for the kubelet readiness/liveness probes. `/` is only a meta-refresh
    # stub to /login (astro.config.mjs `redirects`), so probing it says nothing about the
    # app being served. Answered by nginx directly — no filesystem hit, no redirect.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime public config, rendered from env into /tmp at startup (the root filesystem is
    # read-only, so it can't live under the html root). Never cache — it's regenerated per pod.
    location = /config.js {
        root /tmp;
        default_type application/javascript;
    }

    # Static dashboard routes, with an SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
