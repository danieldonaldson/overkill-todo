# `mise install` provisions the whole dev toolchain, Rust included (mise
# installs rustup itself if missing). Postgres runs in Docker (compose.yaml).
[tools]
# MUST match `channel` in backend/rust-toolchain.toml (CI and the Docker build
# read that file); `just toolchain-check` fails if they drift. Listed first so
# the cargo: tools below build with it.
rust = { version = "1.100.0", components = "rustfmt,clippy,llvm-tools" }
node = "26"
pnpm = "11"
just = "latest"
# Serves the built site for `pnpm preview` and `just e2e` (apps/web/scripts/preview.mjs).
# Same version as the caddy stage in apps/web/Dockerfile; CI installs it from here.
caddy = "2.11.9"
sops = "3.13.3"          # SOPS+age: encrypted secrets committed to git; the version in the cluster's SOPS operator
age = "latest"
yq = "4"                # scripts/secrets.sh (mikefarah yq; preinstalled on CI runners)
sccache = "latest"      # compiler cache shared by every worktree (justfile sets RUSTC_WRAPPER)
"cargo:sqlx-cli" = { version = "0.9", features = "rustls,postgres,sqlx-toml" }   # sqlx-toml: backend/crates/persistence-postgres/sqlx.toml
"cargo:cargo-nextest" = "latest"
"cargo:cargo-watch" = "latest"   # `just dev` backend auto-reload
"cargo:cargo-deny" = "latest"
"cargo:cargo-machete" = "latest"   # `just machete`
"cargo:cargo-llvm-cov" = "latest"   # `just coverage` (needs the llvm-tools component above)
# Kani bounded model checker for the domain proofs (`just verify`, OT-010). Pinned
# exactly: CI installs the same version. `cargo kani setup` fetches its own nightly.
"cargo:kani-verifier" = "0.68.0"
# Quint model checker for the concurrency models (`just models`, OT-010). Pinned
# exactly: CI installs the same version.
"npm:@informalsystems/quint" = "0.33.1"
# Java for Apalache, the symbolic checker behind `quint verify` (Quint downloads
# the Apalache release it was built against on first use).
java = "temurin-21.0.13.1+2.0.LTS"
# Tamarin prover for the protocol model (`just protocols`, OT-010), from the
# official GitHub releases (no maintained image or registry package exists),
# plus Maude, its rewriting engine. Pinned exactly: CI installs the same.
"github:tamarin-prover/tamarin-prover" = { version = "1.12.0", asset_pattern = "tamarin-prover-*-linux64-ubuntu.tar.gz" }
"github:maude-lang/Maude" = { version = "Maude3.5.1", asset_pattern = "Maude-*-linux-x86_64.zip" }
# Python package manager for the API fuzzer (`just fuzz-api`, OT-011). uv also
# installs the Python that apifuzz/.python-version names. Pinned exactly: CI
# installs the same.
uv = "0.13.9"
# OpenSpec CLI for the /opsx:* commands (openspec/README.md). Matches the
# `generatedBy` version of .claude/skills; re-run `openspec update` when bumping.
"npm:@fission-ai/openspec" = "1.13.1"

# Kubernetes (deploy/k8s, OT-014). Pinned exactly; versions of what runs inside
# the cluster are in deploy/k8s/versions.env.
talosctl = "1.14.7"      # same as TALOS_VERSION
kubectl = "1.36.6"      # same minor as KUBERNETES_VERSION
helm = "4.3.2"
argocd = "3.6.3"         # same as ARGOCD_VERSION
kubeconform = "0.8.0"
