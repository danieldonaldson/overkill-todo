name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are worth cancelling. Main is not: a cancelled main run
  # publishes no images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Refuse npm releases younger than 24h (also set in pnpm-workspace.yaml).
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: '1440'

jobs:
  # On PRs, run only the suites whose inputs changed (a dependabot npm bump doesn't
  # need the 5+ minute Rust job). Pushes to main and manual runs always run
  # everything, so images are only ever built from a fully checked commit.
  # Skipped jobs report success, so required checks still resolve.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - .mise.toml
            backend:
              - *shared
              - backend/**
              - scripts/check-rust-pin.sh
            web:
              - *shared
              - apps/**
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .npmrc
              - .nvmrc
              - eslint.config.js
              - .prettierrc
              - tsconfig.base.json

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: overkill_todo
          POSTGRES_PASSWORD: overkill_todo
          POSTGRES_DB: overkill_todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://overkill_todo:overkill_todo@localhost/overkill_todo
      # No debuginfo in CI: nothing reads it (coverage uses its own instrumentation),
      # and it slows compiling/linking and bloats the rust-cache.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7

      # Installs exactly what backend/rust-toolchain.toml pins (with clippy and
      # rustfmt), so CI and local can't drift onto different lint sets.
      - name: Toolchain
        run: rustup toolchain install

      # Local dev gets Rust from .mise.toml; it must pin the same version.
      - name: Rust pins agree
        run: ../scripts/check-rust-pin.sh

      # Only main saves. A PR can restore caches from its own ref or from main, never
      # from another PR, so per-PR saves (~1.1 GiB each) were just filling the 10 GiB
      # repo quota and evicting main's cache — leaving every PR to build cold.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,sqlx-cli,cargo-deny,cargo-machete,cargo-llvm-cov

      - name: Format
        run: cargo fmt --check

      # Advisories (RustSec), licenses, bans, sources. advisories.yml also runs the
      # advisory part weekly, since new advisories land without any code change.
      - name: Check dependency policy
        run: cargo deny check

      # Every unused dependency is compile time paid on every build.
      - name: Unused dependencies
        run: cargo machete

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic -W clippy::nursery
        env:
          SQLX_OFFLINE: 'true'

      - name: Run migrations
        run: cargo sqlx migrate run

      # Runs lib (unit) + integration tests instrumented, so coverage reflects both.
      # No separate unit-test step: it would only add another full, uninstrumented build.
      - name: Integration tests (with coverage)
        run: cargo llvm-cov nextest --locked --tests --lcov --output-path target/lcov.info

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/lcov.info ]; then
            { echo '### Backend coverage'; echo '```'; cargo llvm-cov report --summary-only; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-coverage
          path: backend/target/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      # Fails when a query changed without `just db-prepare`.
      - name: Check SQLx offline cache
        run: cargo sqlx prepare --check -- --all-targets

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @overkill-todo/web exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm --filter @overkill-todo/web check
      - run: pnpm --filter @overkill-todo/web build
      - run: pnpm --filter @overkill-todo/web test:coverage
      - name: Coverage summary
        if: always()
        run: |
          f=apps/web/coverage/summary.txt
          if [ -f "$f" ]; then
            { echo '### Web coverage'; echo '```'; cat "$f"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore
          retention-days: 14

  web-e2e:
    name: Web E2E
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @overkill-todo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @overkill-todo/web build
      - run: pnpm --filter @overkill-todo/web test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Images are built only from main, after every check passed, and tagged with the
  # commit. Deploys reference the tag's digest; CI holds no deploy credentials.
  # Once builds get slow, scope them to what changed since the last published image
  # (notes: "Scope image builds to what changed since the last published image").
  images:
    name: Build ${{ matrix.component }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, web-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
          - component: web
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        # ghcr requires a lowercase repository path.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          provenance: mode=max
          sbom: true
