version: 2

# Weekly, grouped, and never for releases younger than a few days: fresh releases
# are where supply-chain attacks land.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
