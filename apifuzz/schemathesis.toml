# Schemathesis config for `just fuzz-api` (OT-011). run.sh passes the schema,
# base URL, seed, example count and pass; everything else is here.

# One worker: requests share one backend and database, so concurrency would make
# a run's order (and its result) depend on timing. A fixed seed then makes it
# repeatable.
workers = 1
hooks = "hooks"
request-timeout = 30

[cache]
# No state carried between runs (crash files replayed first would change what a
# run sends). A failure is reproduced from its seed instead.
enabled = false

[generation]
# No example database: what one run found must not change the next run's inputs.
database = "none"
# Credentials come from hooks.py (real sessions), never generated: generated
# session cookies replaced the real one, so signed-in cases never reached a
# handler. Missing and invalid credentials are still sent, by the Visitor pass
# and by `ignored_auth`'s probes.
with-security-parameters = false

[phases.stateful]
# Sequences (create, then read/update/delete) wait for the todo endpoints.
enabled = false

# Design Decision 6. On: not_a_server_error, status_code_conformance,
# content_type_conformance, response_schema_conformance,
# negative_data_rejection, ignored_auth, plus the custom checks in hooks.py.
[checks]
# positive_data_acceptance is on (slice 2): a request the description says is
# valid must not get a 400. It is off only for the operations listed at the end,
# whose 400s depend on server state, not on the request's shape.
# Not in slice 1's scope.
response_headers_conformance.enabled = false
missing_required_header.enabled = false
unsupported_method.enabled = false
allow_header_conformance.enabled = false
# Need stateful sequences or resource-owning identities.
use_after_free.enabled = false
ensure_resource_availability.enabled = false
object_level_authorization.enabled = false

# Excluded operations, each with its reason. Everything else is fuzzed.
[[operations]]
# Exchanges the authorization code with Google: a real network call to a third
# party. `GET /auth/oauth/{provider}` (which only builds the redirect) is fuzzed.
include-path = "/api/v1/auth/oauth/{provider}/callback"
enabled = false

# positive_data_acceptance off: these refuse well-formed requests with 400 by
# design, depending on server state or configuration, which a schema can't say.
[[operations]]
# A well-formed code that is wrong, expired or locked is a 400 with error_code.
include-path = "/api/v1/auth/verify-email"
checks.positive_data_acceptance.enabled = false

[[operations]]
# Same, for password-reset codes ("No reset code found", "Invalid reset code").
include-path = "/api/v1/auth/verify-reset-code"
checks.positive_data_acceptance.enabled = false

[[operations]]
# A well-formed magic-link token that is unknown or used is a 400 with error_code.
include-path = "/api/v1/auth/verify-magic"
include-method = "POST"
checks.positive_data_acceptance.enabled = false

[[operations]]
# Whether a password is required depends on whether the account has one.
include-path = "/api/v1/users/me"
include-method = "DELETE"
checks.positive_data_acceptance.enabled = false

[[operations]]
# Only for accounts without a password (OAuth-only); the fuzz Member has one.
include-path = "/api/v1/users/password/set"
checks.positive_data_acceptance.enabled = false

[[operations]]
# Which providers work depends on configuration: the enum lists every provider
# the domain knows, and only Google is configured.
include-path = "/api/v1/auth/oauth/{provider}"
include-method = "GET"
checks.positive_data_acceptance.enabled = false

# A 16 KB body limit (MAX_BODY_BYTES) runs before validation, so an invalid
# body that is also oversized gets a 413, not a 400. That is still a rejection:
# the defaults plus 413. Scoped here because no other route has a limit small
# enough for the fuzzer to hit.
[[operations]]
include-path = "/api/v1/client-telemetry"
include-method = "POST"
checks.negative_data_rejection.expected-statuses = [
  "400", "401", "403", "404", "405", "406", "409", "413", "415", "422", "428", "429", "5xx",
]
