# Restarts pods when a Secret they use changes (D3).
reloader:
  # Adds a pod annotation, which ArgoCD doesn't see as drift.
  reloadStrategy: annotations
  deployment:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
