apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  project: default
  sources:
    - repoURL: https://stakater.github.io/stakater-charts
      chart: reloader
      targetRevision: 2.2.21
      helm:
        releaseName: reloader
        valueFiles:
          - $repo/deploy/k8s/cluster/reloader/values.yaml
    - repoURL: https://github.com/danieldonaldson/overkill-todo.git
      targetRevision: ot-014-kubernetes
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - ServerSideApply=true
