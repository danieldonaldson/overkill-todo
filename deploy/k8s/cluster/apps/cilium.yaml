apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.5
      helm:
        releaseName: cilium
        valueFiles:
          - $repo/deploy/k8s/cluster/cilium/values.yaml
    - repoURL: https://github.com/danieldonaldson/overkill-todo.git
      targetRevision: ot-014-kubernetes
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Retry the newest commit: without it a failing sync retries its own
      # revision for ever and never sees the revert.
      refresh: true
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - ServerSideApply=true
