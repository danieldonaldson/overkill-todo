# Applied once by hand (scripts/k8s.sh); it owns everything in apps/, itself included.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/danieldonaldson/overkill-todo.git
    targetRevision: ot-014-kubernetes
    path: deploy/k8s/cluster/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Retry the newest commit: without it a failing sync retries its own
      # revision for ever and never sees the revert.
      refresh: true
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - ServerSideApply=true
