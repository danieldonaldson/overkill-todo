apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  project: default
  source:
    repoURL: https://github.com/danieldonaldson/overkill-todo.git
    targetRevision: ot-014-kubernetes
    path: deploy/k8s/cluster/edge
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Retry the newest commit: without it a failing sync retries its own
      # revision for ever and never sees the revert.
      refresh: true
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - ServerSideApply=true
