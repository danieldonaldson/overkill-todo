# The edge (D6). It adopts a client's trace context; accepted, see D6's result.
providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true
ingressClass:
  enabled: true
  isDefaultClass: true
log:
  format: json
accessLog:
  enabled: true
  format: json
# Reached from the host at the edge Application's address (2.4).
service:
  spec:
    type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: 10.5.0.100
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }
