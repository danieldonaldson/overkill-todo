# local-path-provisioner v0.0.37, with its path on Talos's writable volume (D8).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream.yaml # vendored unchanged
patches:
  # Committed with its Pod Security label in apps/namespaces.yaml.
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        config.json: |
          {"nodePathMap": [{"node": "DEFAULT_PATH_FOR_NON_LISTED_NODES", "paths": ["/var/mnt/local-path"]}]}
  - patch: |
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
        annotations:
          storageclass.kubernetes.io/is-default-class: 'true'
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: local-path-provisioner
        namespace: local-path-storage
      spec:
        template:
          spec:
            containers:
              - name: local-path-provisioner
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { memory: 128Mi }
