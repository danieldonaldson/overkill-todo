# Where CNPG archives WAL and base backups. Credentials live in a sealed/encrypted Secret.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: overkill-todo-db-store
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://BUCKET/overkill-todo-db
    endpointURL: https://S3_ENDPOINT
    s3Credentials:
      accessKeyId: { name: overkill-todo-db-backup-s3, key: ACCESS_KEY_ID }
      secretAccessKey: { name: overkill-todo-db-backup-s3, key: SECRET_ACCESS_KEY }
    wal:
      compression: gzip
