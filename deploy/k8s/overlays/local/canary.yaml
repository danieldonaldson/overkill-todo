# Throwaway workload for slice 1's checks: serves the secret's VERSION.
apiVersion: v1
kind: Namespace
metadata:
  name: canary
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: canary
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: canary }
  template:
    metadata:
      labels: { app.kubernetes.io/name: canary }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: canary
          image: canary
          command:
            [
              sh,
              -c,
              'printf %s "$VERSION" >/www/index.html; trap "sleep 5; exit 0" TERM; httpd -f -p 8080 -h /www & wait',
            ]
          envFrom:
            - secretRef: { name: canary-v9 }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: www, mountPath: /www }
      volumes:
        - name: www
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: canary
  namespace: canary
spec:
  selector: { app.kubernetes.io/name: canary }
  ports: [{ name: http, port: 8080, targetPort: http }]
