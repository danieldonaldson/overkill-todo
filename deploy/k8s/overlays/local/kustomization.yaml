# The local cluster. Synced by the workloads Application, with the SopsSecrets in
# deploy/secrets/local. The app arrives in slice 2. Never leave this empty: Kustomize
# won't render it, and ArgoCD won't prune an Application to nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
