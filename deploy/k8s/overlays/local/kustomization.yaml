# The local cluster. Synced by the workloads Application, with the SopsSecrets in
# deploy/secrets/local. Never leave this empty: Kustomize won't render it, and ArgoCD
# won't prune an Application to nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - issuer.yaml
# Images from main, by digest (D10): the commit last merged into this branch, so
# its migrations match these manifests.
images:
  - name: backend
    newName: ghcr.io/danieldonaldson/overkill-todo/backend
    digest: sha256:0d89cdf9fe6c1f5a9e33220985b97696b177bce5946f1c9f93335205cb99d6a7 # 962508e
  - name: web
    newName: ghcr.io/danieldonaldson/overkill-todo/web
    digest: sha256:202eb4effbe839fec4231533f4eb23d6f33a2bb69d9585462e94f9c34e02bf23 # 962508e
configMapGenerator:
  # Development mode off (D5); secrets are in backend-v2.
  - name: backend-config
    namespace: overkill-todo
    literals:
      - DEV_MODE=false
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=4322
      - APP_NAME=Overkill Todo
      - FRONTEND_BASE_URL=https://todo.k8s.test
      - GOOGLE_OAUTH_ENABLED=false
      - JWT_EXPIRATION_MINUTES=15
      - REFRESH_TOKEN_EXPIRATION_DAYS=30
      # Production cost (backend/.env.example): 64 MiB per hash.
      - ARGON2_MEMORY_COST=65536
      - ARGON2_TIME_COST=3
      - ARGON2_PARALLELISM=4
      # Plain words: the backend parses "name <address>" unquoted, so ()<>@,;:" break it.
      - SMTP_FROM_NAME=Overkill Todo Local
      - MX_VALIDATION_ENABLED=true
      # The collector arrives in slice 5; until then export fails quietly.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4317
      - OTEL_SERVICE_NAME=overkill-todo-backend
      - DEPLOYMENT_ENVIRONMENT=local-cluster
      - LOG_FORMAT=json
  - name: web-config
    namespace: overkill-todo
    literals:
      # Cloudflare's published test key: always passes, visibly (D5).
      - PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
patches:
  - target: { kind: Deployment, name: backend }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: backend-v2
  - target: { kind: Ingress, name: overkill-todo }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: todo.k8s.test
      - op: add
        path: /spec/tls
        value: [{ hosts: [todo.k8s.test], secretName: overkill-todo-tls }]
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: local-ca
  # Backups arrive in slice 3, with Garage (D7).
  - patch: |
      $patch: delete
      apiVersion: postgresql.cnpg.io/v1
      kind: ScheduledBackup
      metadata:
        name: overkill-todo-db-daily
  - target: { kind: Cluster, name: overkill-todo-db }
    patch: |
      - op: remove
        path: /spec/plugins
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
