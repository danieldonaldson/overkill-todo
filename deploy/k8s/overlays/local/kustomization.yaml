# The local cluster. Synced by the workloads Application, with the SopsSecrets in
# deploy/secrets/local. Never leave this empty: Kustomize won't render it, and ArgoCD
# won't prune an Application to nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - issuer.yaml
  - object-store.yaml
# Images from main, by digest (D10): the commit last merged into this branch, so
# its migrations match these manifests.
images:
  - name: backend
    newName: ghcr.io/danieldonaldson/overkill-todo/backend
    digest: sha256:980453e1cad9a4df6992d20f70586919cecd4ba6ebbbaec39036c9b8212df85d # 47c6baf
  - name: web
    newName: ghcr.io/danieldonaldson/overkill-todo/web
    digest: sha256:bf8742e6bcef4e5aed20f9bf76dac38e88dc9717a505789ba75a51ec01297d7f # 47c6baf
configMapGenerator:
  # Development mode off (D5); secrets are in backend-v2.
  - name: backend-config
    namespace: overkill-todo
    literals:
      - DEV_MODE=false
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=4322
      - APP_NAME=Overkill Todo
      - FRONTEND_BASE_URL=https://todo.k8s.test
      - GOOGLE_OAUTH_ENABLED=false
      - JWT_EXPIRATION_MINUTES=15
      - REFRESH_TOKEN_EXPIRATION_DAYS=30
      # Production cost (backend/.env.example): 64 MiB per hash.
      - ARGON2_MEMORY_COST=65536
      - ARGON2_TIME_COST=3
      - ARGON2_PARALLELISM=4
      # Plain words: the backend parses "name <address>" unquoted, so ()<>@,;:" break it.
      - SMTP_FROM_NAME=Overkill Todo Local
      - MX_VALIDATION_ENABLED=true
      # The collector arrives in slice 5; until then export fails quietly.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability:4317
      - OTEL_SERVICE_NAME=overkill-todo-backend
      - DEPLOYMENT_ENVIRONMENT=local-cluster
      - LOG_FORMAT=json
  - name: web-config
    namespace: overkill-todo
    literals:
      # Cloudflare's published test key: always passes, visibly (D5).
      - PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
patches:
  - target: { kind: Deployment, name: backend }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: backend-v2
  - target: { kind: Ingress, name: overkill-todo }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: todo.k8s.test
      - op: add
        path: /spec/tls
        value: [{ hosts: [todo.k8s.test], secretName: overkill-todo-tls }]
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: local-ca
  # A cluster created from this restores from the newest backup (D7); with none,
  # it doesn't start. The first run is `./scripts/k8s.sh db-init`
  # (overlays/local-initdb). CNPG reads bootstrap only when it creates a Cluster,
  # and the workloads Application ignores it on one that exists.
  #
  # Backups are a streaming Barman server's, on the host (D7a, scripts/k8s.sh):
  # it streams WAL over a slot and copies backups and finished WAL to Garage,
  # which the plugin restores from. So the plugin here only restores; the base's
  # WAL archiving and ScheduledBackup go.
  - target: { kind: Cluster, name: overkill-todo-db }
    patch: |
      - op: replace
        path: /spec/bootstrap
        value:
          recovery:
            source: backup
            database: overkill_todo
            owner: overkill_todo
      - op: add
        path: /spec/externalClusters
        value:
          - name: backup
            plugin:
              name: barman-cloud.cloudnative-pg.io
              parameters:
                barmanObjectName: overkill-todo-db-store
                serverName: overkill-todo-db
      - op: add
        path: /spec/plugins/0/parameters/serverName
        value: overkill-todo-db
      # Three instances, one replica synchronous (D15): a failover loses no
      # committed write, and losing one replica doesn't stop writes. All three
      # share the VM's disk, so backups still guard against losing it.
      - op: replace
        path: /spec/instances
        value: 3
      - op: add
        path: /spec/postgresql/synchronous
        value: { method: any, number: 1 }
      # Barman's role: a superuser, as in Barman's own setup, by password and
      # from the VM bridge only (replication needs its own rule).
      - op: add
        path: /spec/postgresql/pg_hba
        value:
          - host replication barman 10.5.0.0/24 scram-sha-256
          - host postgres barman 10.5.0.0/24 scram-sha-256
      # While Barman is away its slot keeps WAL here; past this, Postgres drops
      # the slot's claim rather than fill the disk (5 GiB), and Barman restarts.
      - op: add
        path: /spec/postgresql/parameters/max_slot_wal_keep_size
        value: 2GB
      # Barman's slot moves to a new primary on failover.
      - op: add
        path: /spec/replicationSlots
        value:
          highAvailability: { enabled: true }
          synchronizeReplicas: { enabled: true }
      - op: add
        path: /spec/managed
        value:
          roles:
            - name: barman
              ensure: present
              login: true
              superuser: true
              replication: true
              passwordSecret: { name: barman-db-v1 }
          services:
            # The primary on the VM bridge, for Barman (cluster/edge pool).
            additional:
              - selectorType: rw
                serviceTemplate:
                  metadata:
                    name: overkill-todo-db-host
                    labels: { overkill-todo/lb-pool: database }
                  spec:
                    type: LoadBalancer
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
          cnpg.io/skipEmptyWalArchiveCheck: enabled
  - target: { kind: ScheduledBackup, name: overkill-todo-db-daily }
    patch: |
      - op: add
        path: /spec/immediate
        value: true
