# Signs the edge's certificate with the local CA (D6). Its key is the SopsSecret
# deploy/secrets/local/local-ca.sops.yaml; its certificate, to trust on the host,
# is deploy/k8s/local-ca.crt. The CA can only sign names under k8s.test.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: local-ca-v1
