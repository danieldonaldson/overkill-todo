# The local database's first run only: an empty database instead of a restore.
# Never synced by ArgoCD. `./scripts/k8s.sh db-init` creates the Cluster from this,
# and only when the backup store holds no backup (D7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../local
patches:
  - target: { kind: Cluster, name: overkill-todo-db }
    patch: |
      - op: replace
        path: /spec/bootstrap
        value:
          initdb:
            database: overkill_todo
            owner: overkill_todo
      - op: remove
        path: /spec/externalClusters
