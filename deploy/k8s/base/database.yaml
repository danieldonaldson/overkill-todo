# Postgres via CloudNativePG (operator must be installed). CNPG creates the
# `overkill-todo-db-app` secret the backend reads DATABASE_URL from.
#
# Backups: continuous WAL archiving + base backups to object storage through the
# barman-cloud plugin. The ObjectStore (bucket, credentials, retention) is
# environment-specific, so the overlay supplies it. Restore = a new Cluster with
# `bootstrap.recovery` pointing at that store; rehearse it before relying on it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: overkill-todo-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  bootstrap:
    initdb:
      database: overkill_todo
      owner: overkill_todo
  postgresql:
    shared_preload_libraries: [pg_stat_statements]
    parameters:
      # Drops DETAIL lines, which can hold row values (OT-013 D9).
      log_error_verbosity: terse
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: overkill-todo-db-store
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: overkill-todo-db-daily
  annotations:
    # After the database is healthy (ArgoCD's CNPG health check): created with it, an
    # immediate backup fails before the plugin's sidecar is in its pod.
    argocd.argoproj.io/sync-wave: '1'
spec:
  schedule: '0 0 3 * * *'
  backupOwnerReference: self
  cluster:
    name: overkill-todo-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# The app's owner can't create extensions; the first migration's
# `CREATE EXTENSION IF NOT EXISTS pg_stat_statements` finds it made here.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: overkill-todo
spec:
  cluster:
    name: overkill-todo-db
  name: overkill_todo
  owner: overkill_todo
  extensions:
    - name: pg_stat_statements
      ensure: present
