# Single-host production override. Paths resolve from the repo root. Use with the base file:
#
#   docker compose -f compose.yaml -f deploy/compose/compose.prod.yaml --profile full up -d
#
# Differences from the local `full` profile, and nothing else:
#   - images are pulled by digest (set in deploy/compose/.env), never built here
#   - the DB password and backend config come from files decrypted from SOPS
#     (`just secrets-decrypt prod` → deploy/compose/.secrets/, see deploy/secrets/)
#   - the edge serves $DOMAIN on 80/443 with automatic TLS
#   - a nightly pg_dump runs (copy it off the host; see README)
#   - with `--profile observability`: telemetry stack, Grafana on the host's
#     loopback only (reach it through an SSH tunnel; see README), Alertmanager
#     emailing the operator (alertmanager.prod.yml) and not published at all
services:
  db:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    # Not published on the host in production.
    ports: !reset []
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to ghcr.io/<owner>/<repo>/backend@sha256:...}
    build: !reset null
    env_file: !override
      - ./deploy/compose/.secrets/backend.env
    environment:
      DATABASE_URL: !reset null
      FRONTEND_BASE_URL: https://${DOMAIN:?set DOMAIN}
      # Required when DEV_MODE=false: the backend refuses to start without it.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: production
      # Required when DEV_MODE=false: the no-op MX validator is dev-only.
      MX_VALIDATION_ENABLED: "true"
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to ghcr.io/<owner>/<repo>/web@sha256:...}
    build: !reset null
    environment:
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped

  edge:
    ports: !override
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      # OTLP endpoint and service name come from compose.yaml.
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production
    volumes: !override
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

  backup:
    profiles: ['full']
    image: postgres:18
    environment:
      PGHOST: db
      PGUSER: overkill_todo
      PGDATABASE: overkill_todo
      PGPASSFILE: /tmp/.pgpass
    secrets: [db_password]
    volumes:
      - ./deploy/compose/backups:/backups
    entrypoint: ['/bin/sh', '-c']
    # Nightly custom-format dump, 14 kept. A dump on the same disk is not a backup:
    # sync ./backups off the host (restic, rclone) and rehearse a restore.
    command:
      - |
        printf 'db:5432:overkill_todo:overkill_todo:%s\n' "$$(cat /run/secrets/db_password)" > /tmp/.pgpass
        chmod 600 /tmp/.pgpass
        while true; do
          f=/backups/overkill-todo-$$(date -u +%Y%m%dT%H%M%SZ).dump
          pg_dump -Fc -f "$$f.partial" && mv "$$f.partial" "$$f" && echo "backup ok $$f"
          ls -1t /backups/*.dump | tail -n +15 | xargs -r rm --
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---- observability (`--profile observability`) ----------------------
  otel-collector:
    # No host port in production: only the backend (same network) sends to it.
    ports: !reset []
    restart: unless-stopped

  tempo:
    restart: unless-stopped

  victorialogs:
    restart: unless-stopped

  victoriametrics:
    restart: unless-stopped

  postgres-exporter:
    environment:
      DATA_SOURCE_PASS: !reset null
      DATA_SOURCE_PASS_FILE: /run/secrets/db_password
    secrets: [db_password]
    restart: unless-stopped

  vmalert:
    restart: unless-stopped

  alertmanager:
    volumes: !override
      - ./deploy/observability/alertmanager/alertmanager.prod.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [alertmanager_smtp_password]
    ports: !reset []
    restart: unless-stopped

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: !reset null
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: http://localhost:3000
    secrets: [grafana_admin_password]
    # Host loopback only. Caddy routes nothing here, so the public domain
    # can't reach it: `ssh -L 3000:localhost:3000 <host>`.
    ports: !override
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

secrets:
  db_password:
    file: ./deploy/compose/.secrets/db_password
  grafana_admin_password:
    file: ./deploy/compose/.secrets/grafana_admin_password
  alertmanager_smtp_password:
    file: ./deploy/compose/.secrets/alertmanager_smtp_password

volumes:
  caddy-data:
