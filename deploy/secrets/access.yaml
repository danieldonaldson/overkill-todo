# Who can decrypt which secrets. This file is the policy; `.sops.yaml` is
# generated from it. After any change here: `just secrets-sync`, then commit
# this file, `.sops.yaml` and the re-keyed secrets together. See README.md.

# Environments, lowest first. Access cascades upward: a person cleared for a
# level can read that level and every level before it (prod reads staging and
# local; staging reads local). Each is a directory beside this file.
levels: [local, staging, prod]

# People: an age public key (`age-keygen -y ~/.config/sops/age/keys.txt`) and
# the highest level they're cleared for.
people:
  daniel:
    key: age1slszqve3ls2qll0t568kqlrtfw3h2x4gwjxv3h0lz72ejmj6cvus0075ug
    level: prod

# Hosts: an age key generated on the host itself (the private half never leaves
# it). A machine reads only its own environment, never a lower or higher one.
machines: {}
  # prod-host:
  #   key: age1...
  #   env: prod

# Per-secret exceptions, keyed by path under deploy/secrets/. Without an entry a
# secret follows its level. The environment's machines are always included.
#   only: [names]  narrow: of the people cleared for this level, just these
#   also: [names]  widen: these people too, though cleared for a lower level
secrets: {}
  # prod/backend.sops.env:
  #   only: [daniel]
  # prod/grafana_admin_password.sops:
  #   also: [alice]
