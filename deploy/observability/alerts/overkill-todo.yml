# vmalert rules (design Decision 10). Thresholds are the spec's
# ("Operator is alerted to problems"). Unit tests: tests/*.yml
# (`just obs-check` runs them with vmalert-tool).
#
# Metric names are VictoriaMetrics' Prometheus-style translation of the OTLP
# names (`-opentelemetry.usePrometheusNaming`), e.g.
# http.server.request.duration → http_server_request_duration_seconds_*.
#
# `dashboard` links open the matching panel in Grafana through the operator's
# tunnel (http://localhost:3000, design Decision 11).

groups:
  - name: backend
    rules:
      # Only above 1 request/minute, so a single failure on a quiet night
      # (1 of 3 requests) doesn't page anyone.
      - alert: BackendErrorRateHigh
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{status_class="5xx"}[5m]))
              / sum(rate(http_server_request_duration_seconds_count[5m]))
          ) > 0.02
          and sum(rate(http_server_request_duration_seconds_count[5m])) > 1/60
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'Backend 5xx rate is {{ $value | humanizePercentage }} (threshold 2%)'
          dashboard: 'http://localhost:3000/d/service-overview/service-overview?viewPanel=panel-2'

      - alert: BackendLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 'Backend p95 latency is {{ $value | humanizeDuration }} (threshold 1s)'
          dashboard: 'http://localhost:3000/d/service-overview/service-overview?viewPanel=panel-3'

      # httpcheck probes /health/ready every 15s from inside the network.
      # A successful probe reports {http_status_class="2xx",
      # http_status_code="200"} = 1; a failed one reports a different series
      # (no status code) = 0. The old series has no staleness marker, so plain
      # max() would keep seeing its last 1 for ~5 minutes: only samples from
      # the last 30s count.
      - alert: BackendDown
        expr: max(last_over_time(httpcheck_status_ratio{http_status_class="2xx"}[30s])) < 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: 'Backend readiness check has been failing for 2 minutes'
          dashboard: 'http://localhost:3000/d/service-overview/service-overview?viewPanel=panel-6'

  - name: database
    rules:
      - alert: DatabaseDown
        expr: min(pg_up) == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: 'Database is unreachable from postgres_exporter'
          dashboard: 'http://localhost:3000/d/service-overview/service-overview?viewPanel=panel-7'

      - alert: DatabaseConnectionsHigh
        expr: |
          sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 'Database connections at {{ $value | humanizePercentage }} of max_connections (threshold 80%)'
          dashboard: 'http://localhost:3000/d/service-overview/service-overview?viewPanel=panel-7'

  - name: telemetry
    rules:
      - alert: TelemetryVolumeFilling
        expr: max by (mountpoint) (system_filesystem_utilization_ratio) > 0.8
        for: 15m
        labels:
          severity: page
        annotations:
          summary: 'Telemetry volume {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full (threshold 80%)'
          dashboard: 'http://localhost:3000/d/service-overview/service-overview?viewPanel=panel-8'

      # Any exporter (Tempo, VictoriaLogs, VictoriaMetrics) dropping data.
      - alert: TelemetryExportFailing
        expr: |
          sum by (exporter) (
            rate({__name__=~"otelcol_exporter_send_failed_(spans|log_records|metric_points)_total"}[5m])
          ) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 'Collector exporter {{ $labels.exporter }} is failing to deliver telemetry'
          dashboard: 'http://localhost:3000/d/service-overview/service-overview?viewPanel=panel-8'

  - name: background
    rules:
      # job_last_success_timestamp starts when the job starts on the leader, so
      # a job that has never succeeded since then still alerts. max by (job)
      # takes the newest value across replicas: a replica that stood down keeps
      # reporting its old timestamp. If no replica reports at all, the backend
      # is down and BackendDown fires instead.
      - alert: JobNotSucceeding
        expr: |
          time() - max by (job) (job_last_success_timestamp_seconds)
            > 2 * max by (job) (job_interval_seconds) + 900
        labels:
          severity: page
        annotations:
          summary: 'Background job {{ $labels.job }} has not succeeded for {{ $value | humanizeDuration }}'
          dashboard: 'http://localhost:3000/d/jobs/jobs?viewPanel=panel-1'

      # Each replica reports 1 or 0. Only samples from the last minute count
      # (pushes are every 15s): a stopped replica's series has no staleness
      # marker, and without this its last 1 would linger for ~5 minutes and a
      # normal failover would look like two leaders. When no replica reports,
      # the sum is empty and BackendDown covers it.
      - alert: LeaderCountWrong
        expr: sum(last_over_time(leader_is_leader[1m])) != 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: '{{ $value }} replicas hold the background-work leader lock (expected exactly 1)'
          dashboard: 'http://localhost:3000/d/jobs/jobs?viewPanel=panel-5'

      # Web analytics retention (OT-005, deploy/analytics/). The job runs daily
      # and re-pushes its last-success time every hour; on start that time is
      # the start, so a job that never succeeds still fires. last_over_time
      # keeps the newest value for 14 days, so a stopped container fires too
      # (its series goes stale, it doesn't vanish from this query). No series
      # at all means analytics isn't deployed: no alert.
      - alert: AnalyticsRetentionNotSucceeding
        expr: |
          time() - max(last_over_time(analytics_retention_last_success_timestamp_seconds[14d]))
            > 2 * 86400 + 900
        labels:
          severity: page
          job: analytics_retention
        annotations:
          summary: 'Analytics retention job (analytics_retention) has not succeeded for {{ $value | humanizeDuration }}'

  # Authentication abuse (OT-007, design D5). Thresholds are absolute counts,
  # not ratios: at this site's traffic a ratio fires on 2 failed sign-ins out of
  # 3 at night. They are a first guess, revisited after the first month in
  # production. No `for`: the window is already in the range, and a `for` would
  # delay a burst by another window. `severity: warning` routes the same as
  # `page` today; it lets a later change route security alerts differently.
  - name: auth
    rules:
      - alert: AuthSignInFailuresHigh
        expr: |
          sum(increase(auth_attempts_total{flow="password_sign_in",outcome="failure"}[15m])) > 30
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | humanize }} failed password sign-ins in the last 15 minutes (threshold 30)'
          dashboard: 'http://localhost:3000/d/auth-security/auth-security?viewPanel=panel-9'

      # Counted once per code, on the guess that uses the last attempt; guesses
      # refused while it stays locked are not lockouts.
      - alert: AuthCodeLockoutsHigh
        expr: |
          sum(increase(auth_code_lockouts_total[1h])) > 5
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | humanize }} codes locked in the last hour (threshold 5)'
          dashboard: 'http://localhost:3000/d/auth-security/auth-security?viewPanel=panel-6'

      # Across all four protected forms. A Turnstile outage is a 500, not a
      # rejection, and is covered by the 5xx alert.
      - alert: AuthBotCheckRejectionsHigh
        expr: |
          sum(increase(auth_bot_check_rejections_total[15m])) > 50
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | humanize }} bot-check rejections in the last 15 minutes (threshold 50)'
          dashboard: 'http://localhost:3000/d/auth-security/auth-security?viewPanel=panel-10'

      # A revoked refresh token presented again, or a refresh from another
      # device. 3, not 1: a retried refresh on a flaky network can look like
      # reuse once.
      - alert: AuthSessionAnomalies
        expr: |
          sum(increase(auth_session_anomalies_total[1h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | humanize }} session anomalies in the last hour (alerts at 3)'
          dashboard: 'http://localhost:3000/d/auth-security/auth-security?viewPanel=panel-11'

  # Browser problems (OT-006 Decision 11). A separate group from the backend
  # and business rules.
  - name: frontend
    rules:
      # Per page and release, so the email names both. Errors from other
      # origins are never counted in browser_error_total. Only with at least 1
      # page load a minute on that page, so 1 error in 3 quiet page loads
      # doesn't page anyone. Page loads carry no release: each release is
      # measured against all of the page's loads.
      - alert: BrowserErrorRateHigh
        expr: |
          (
            sum by (page, release) (rate(browser_error_total[10m]))
              / on (page) group_left
            sum by (page) (rate(browser_page_load_total[10m]))
          ) > 0.02
          and on (page) sum by (page) (rate(browser_page_load_total[10m])) * 60 >= 1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 'Browser errors on {{ $labels.page }} (release {{ $labels.release }}) are {{ $value | humanizePercentage }} of page loads (threshold 2%)'
          dashboard: 'http://localhost:3000/d/frontend/frontend?viewPanel=panel-6'

      # Per page and vital: p75 INP over 500 ms or LCP over 4 s across the last
      # hour, with at least 50 measurements in it, held for an hour. The
      # histogram's bucket edges sit on both thresholds. Not paging: a slow page
      # is worth a look the same day, not at night.
      - alert: BrowserVitalPoor
        expr: |
          (
            histogram_quantile(0.75, sum by (page, name, le) (rate(browser_web_vital_milliseconds_bucket{name="INP"}[1h]))) > 500
            or
            histogram_quantile(0.75, sum by (page, name, le) (rate(browser_web_vital_milliseconds_bucket{name="LCP"}[1h]))) > 4000
          )
          and on (page, name)
            sum by (page, name) (increase(browser_web_vital_milliseconds_count{name=~"INP|LCP"}[1h])) >= 50
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'p75 {{ $labels.name }} on {{ $labels.page }} is {{ $value | humanize }} ms over the last hour (poor: INP over 500 ms, LCP over 4000 ms)'
          dashboard: 'http://localhost:3000/d/frontend/frontend?viewPanel=panel-9'
