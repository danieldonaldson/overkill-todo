# Local services, and an optional prod-like stack.
#
#   docker compose up -d db                  # just the database (what `just dev` uses)
#   docker compose --profile full up --build # db + backend + web + Caddy edge on :8080
#
# The `full` profile is the same images CI builds, behind the same single-origin
# routing production uses (/api → backend, everything else → web). It is also a
# workable single-VPS deployment: see deploy/compose/README.md.
#
# Observability (opt-in, `just obs-up`): collector + Tempo + VictoriaLogs +
# VictoriaMetrics + vmalert + Alertmanager (http://localhost:9093) + Grafana
# on http://localhost:3000. See deploy/observability/ and OT-001.
#
# COMPOSE_PROJECT_NAME overrides `name:` below; `just wt-new` sets it per worktree
# so each checkout gets its own database container and volume.
name: overkill-todo

# json-file logs tagged with the compose service name, so the collector can
# tell containers apart (attrs.com.docker.compose.service), and rotated so
# they never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    labels: com.docker.compose.service
    max-size: 10m
    max-file: '5'

services:
  db:
    logging: *logging
    image: postgres:18
    # pg_stat_statements is created by the initial migration; it must be preloaded.
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    environment:
      POSTGRES_USER: overkill_todo
      POSTGRES_PASSWORD: overkill_todo
      POSTGRES_DB: overkill_todo
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U overkill_todo -d overkill_todo']
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    logging: *logging
    profiles: ['full']
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://overkill_todo:overkill_todo@db:5432/overkill_todo
      FRONTEND_BASE_URL: http://localhost:${EDGE_PORT:-8080}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '4322'
      # JSON logs even in dev mode, so the collector can parse them. Telemetry
      # export only works with the `observability` profile running too.
      LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      db:
        condition: service_healthy

  web:
    logging: *logging
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    read_only: true
    tmpfs: ['/tmp']
    environment:
      PUBLIC_TURNSTILE_SITE_KEY: ''

  edge:
    logging: *logging
    profiles: ['full']
    image: caddy:2
    ports:
      - '${EDGE_PORT:-8080}:8080'
    volumes:
      - ./deploy/compose/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on: [backend, web]

  # ---- observability (profile `observability`) -------------------------
  otel-collector:
    profiles: ['observability']
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ['--config=/etc/otelcol/config.yaml']
    # Root only to read other containers' json-file logs (root-owned, 0640).
    # Read-only mount, no public port.
    user: '0'
    environment:
      # Readiness probe target (httpcheck). With `just dev` the backend runs on
      # the host: BACKEND_READY_URL=http://host.docker.internal:4322/health/ready
      BACKEND_READY_URL: ${BACKEND_READY_URL:-http://backend:4322/health/ready}
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./deploy/observability/collector/config.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Telemetry stores, mounted only so `hostmetrics` can report their usage.
      - tempo-data:/telemetry/tempo:ro
      - vlogs-data:/telemetry/victorialogs:ro
      - vmetrics-data:/telemetry/victoriametrics:ro
    ports:
      # For a natively running backend (`just dev`): OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - '127.0.0.1:4318:4318'
    mem_limit: 256m
    depends_on: [tempo, victorialogs, victoriametrics]

  tempo:
    profiles: ['observability']
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./deploy/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m

  victorialogs:
    profiles: ['observability']
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=30d
      # Hard cap: a log storm can't fill the disk (oldest data dropped first).
      - -retention.maxDiskSpaceUsageBytes=${VLOGS_MAX_DISK:-10GiB}
    volumes:
      - vlogs-data:/vlogs
    mem_limit: 256m

  victoriametrics:
    profiles: ['observability']
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    command:
      - -storageDataPath=/vmetrics
      - -retentionPeriod=30d
      # OTLP names become Prometheus-style: http_server_request_duration_seconds_bucket.
      - -opentelemetry.usePrometheusNaming
    volumes:
      - vmetrics-data:/vmetrics
    # Sizes its caches to this limit; 256m left no headroom (233 MiB measured, OT-001 slice 2).
    mem_limit: 512m

  # Database availability and connection use, scraped by the collector.
  postgres-exporter:
    profiles: ['observability']
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_URI: db:5432/overkill_todo?sslmode=disable
      DATA_SOURCE_USER: overkill_todo
      # Local only; production reads it from the db_password secret (compose.prod.yaml).
      DATA_SOURCE_PASS: overkill_todo
    mem_limit: 64m
    depends_on:
      db:
        condition: service_healthy

  # Evaluates deploy/observability/alerts/*.yml against VictoriaMetrics.
  vmalert:
    profiles: ['observability']
    image: victoriametrics/vmalert:v1.156.0@sha256:4fea7d1a888d4db4ff18804434ef0f3ca8eb6482e289c50d32001c2db218287c
    command:
      - -rule=/etc/alerts/*.yml
      - -datasource.url=http://victoriametrics:8428
      # Alert state survives restarts: written to and restored from VictoriaMetrics.
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -evaluationInterval=30s
      - -external.url=http://localhost:3000
    volumes:
      - ./deploy/observability/alerts:/etc/alerts:ro
    mem_limit: 128m
    depends_on: [victoriametrics, alertmanager]

  alertmanager:
    profiles: ['observability']
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Local: null receiver, no email. Production mounts alertmanager.prod.yml.
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      # Local alert view. Not published in production.
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    # 55 MiB measured at 64m (OT-001 slice 2).
    mem_limit: 128m

  grafana:
    profiles: ['observability']
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_SECURITY_ADMIN_USER: admin
      # Local only; production reads it from a secret file (compose.prod.yaml).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.33.1
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    # Grafana 13 was OOM-killed at 256m rendering Explore (measured, OT-001 slice 1).
    mem_limit: 512m
    depends_on: [tempo, victorialogs, victoriametrics]

volumes:
  db-data:
  tempo-data:
  vlogs-data:
  vmetrics-data:
  alertmanager-data:
  grafana-data:
