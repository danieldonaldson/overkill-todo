# Formal coverage of lists (OT-013 design D13), checked by `just formal-coverage`
# (scripts/formal-coverage.sh, which documents every rule and check kind).
#
# Every scenario of every requirement in scope names the checks that cover it,
# `pending: <task>` while the task that will check it is unticked, or both: the
# checks that cover it now and the task that still owes one (a model, usually).
# Flows in apps/web/tests/integration aren't named: `just ci` doesn't run them. A
# requirement with no proof, model or replay says in `reason:` why none applies.
# Bounds and assumptions live next to each check: on each Kani harness's doc
# comment, and at the top of each Quint model.
#
# Kani proofs: backend/crates/domain/src/entities/todo_order.rs (ordering, 4.1),
# todo.rs (appending, open or done) and value_objects/single_line.rs
# (validation), all run by `just verify`.

change: ot-013-todos
capabilities:
  lists:
    'A Member manages their lists':
      reason: 'Screens and HTTP answers, tested; the version, limit and ownership rules they rely on are modelled under their own requirements.'
      scenarios:
        'No lists yet':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::never says there are no lists before the server has answered'
            - rust: 'backend/crates/server/tests/lists_integration.rs::empty_lists_and_create_with_counts'
        'Create a list':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::creates a list and replaces the address without reloading'
            - web: 'apps/web/tests/lists.spec.ts::create a list, add and tick a todo, and keep the title of a failed save'
            - rust: 'backend/crates/server/tests/lists_integration.rs::empty_lists_and_create_with_counts'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::lists_are_oldest_first_with_open_and_total_counts'
        'Rename a list':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::renames a list in place'
            - web: 'apps/web/tests/lists.spec.ts::renames and deletes a todo, renames the list, and deletes it'
            - rust: 'backend/crates/server/tests/lists_integration.rs::renaming_and_deleting_lists_and_todos'
        'Count of open todos':
          checks:
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::lists_are_oldest_first_with_open_and_total_counts'
            - web: 'apps/web/src/lib/lists/engine.test.ts::counts a loaded list from its todos and other lists from GET /lists'
    'Deleting a list is confirmed and permanent':
      reason: 'Confirmation is a screen, tested; refusing a deletion after a change elsewhere is modelled in 7.2.'
      scenarios:
        'Confirm deletion':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::confirms a list deletion with its name and todo count'
            - rust: 'backend/crates/server/tests/lists_integration.rs::renaming_and_deleting_lists_and_todos'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::deleting_a_list_deletes_its_todos'
        'Cancel deletion':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::makes the page behind the deletion dialog inert, and Escape cancels'
        'Todo added in another tab before confirming':
          checks:
            - invariant: 'models/list_writes.qnt::listDeleteRefusesChangedCount'
            - invariant: 'models/list_writes.qnt::noTodoOutlivesItsList'
            - broken: 'models/list_writes.qnt::no_count_check'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::deleting_a_list_requires_the_name_and_count_it_was_confirmed_with'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_concurrent_add_makes_the_list_delete_stale_or_waits_until_after_it'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::asks again with the current count when the list changed meanwhile'
    'Each list has its own address':
      reason: 'Addresses are web server rewrites and page routing (HTTP wiring), tested end to end.'
      scenarios:
        'Reload or bookmark':
          checks:
            - web: 'apps/web/tests/list-address.spec.ts::survives a reload and an in-site move away and back'
        'Address does not open a list':
          checks:
            - web: 'apps/web/tests/list-address.spec.ts::with a malformed id shows the shell and asks for nothing'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::shows list not found when the server says 404'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::shows list not found for a malformed address without a request'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::shows list not found for a nested address without a request'
            - rust: 'backend/crates/server/tests/lists_integration.rs::unknown_and_foreign_ids_share_the_404_codes'
        'Shared address':
          checks:
            - rust: 'backend/crates/server/tests/lists_security_integration.rs::another_members_ids_answer_exactly_like_unknown_ids'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::shows list not found when the server says 404'
    'A Member manages the todos in a list':
      scenarios:
        'Empty list':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::shows an empty list with the add field and no Completed group'
        'Add a todo':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::adds a todo and marks it done optimistically'
            - rust: 'backend/crates/server/tests/lists_integration.rs::adding_and_marking_todos_orders_them_and_answers_409_on_stale'
        'Mark done':
          checks:
            - kani: 'backend/crates/domain/src/entities/todo.rs::a_todo_is_open_or_done'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::marking_done_and_not_done_moves_the_todo_as_specified'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::done_todos_come_back_most_recently_completed_first'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::groups done todos in a collapsed Completed group'
        'Mark not done':
          checks:
            - kani: 'backend/crates/domain/src/entities/todo.rs::appending_goes_one_gap_below_the_last_or_saturates'
            - kani: 'backend/crates/domain/src/entities/todo.rs::no_write_raises_the_highest_position_by_more_than_one_gap'
            - kani: 'backend/crates/domain/src/entities/todo.rs::a_todo_is_open_or_done'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::marking_done_and_not_done_moves_the_todo_as_specified'
            - web: 'apps/web/src/lib/lists/regressions.test.ts::puts an unticked todo at the bottom of the open ones'
        'Rename a todo':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::renames a todo in place and cancels with Escape'
            - web: 'apps/web/tests/lists.spec.ts::renames and deletes a todo, renames the list, and deletes it'
            - rust: 'backend/crates/server/tests/lists_integration.rs::renaming_and_deleting_lists_and_todos'
        'Delete a todo':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::deletes a todo and moves focus to the next one'
            - web: 'apps/web/tests/lists.spec.ts::renames and deletes a todo, renames the list, and deletes it'
            - rust: 'backend/crates/server/tests/lists_integration.rs::renaming_and_deleting_lists_and_todos'
        'Abandon a rename':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::renames a todo in place and cancels with Escape'
    'Open todos can be reordered':
      scenarios:
        'Drag to a new position':
          checks:
            - web: 'apps/web/tests/lists.spec.ts::drags a todo to the top, and the order is kept'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::drags a todo to the bottom'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_todo_moves_to_the_top_the_middle_and_the_bottom'
        'Move with the keyboard':
          checks:
            - web: 'apps/web/tests/lists.spec.ts::moves a todo with the keyboard alone'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::moves with the keyboard, keeping focus and announcing the position'
        'Cancelled drag':
          checks:
            - web: 'apps/web/tests/lists.spec.ts::a drag cancelled with Escape changes and saves nothing'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::saves nothing for a drag that is cancelled or dropped where it was'
        'Many moves':
          checks:
            - kani: 'backend/crates/domain/src/entities/todo_order.rs::a_move_lands_strictly_between_or_asks_for_renumbering'
            - kani: 'backend/crates/domain/src/entities/todo_order.rs::renumbering_is_asked_for_only_without_room'
            - kani: 'backend/crates/domain/src/entities/todo_order.rs::past_either_end_is_one_gap_or_renumbering'
            - kani: 'backend/crates/domain/src/entities/todo_order.rs::renumbering_keeps_the_order_of_five'
            - kani: 'backend/crates/domain/src/entities/todo_order.rs::renumbered_positions_are_distinct_for_every_rank'
            - rust: 'backend/crates/domain/src/entities/todo_order.rs::a_move_lands_in_its_slot_in_up_to_1000_positions'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_thousand_moves_between_the_same_two_todos_lose_nothing'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_move_renumbers_at_either_end_of_the_range'
    'Names and titles are validated':
      scenarios:
        'Blank':
          checks:
            - kani: 'backend/crates/domain/src/value_objects/single_line.rs::the_single_line_rule_trims_counts_code_points_and_refuses_line_breaks'
            - rust: 'backend/crates/domain/src/value_objects/single_line.rs::whitespace_only_is_empty'
            - rust: 'backend/crates/server/tests/lists_integration.rs::blank_names_and_titles_are_400'
        'At the length limit':
          checks:
            - kani: 'backend/crates/domain/src/value_objects/single_line.rs::the_single_line_rule_trims_counts_code_points_and_refuses_line_breaks'
            - rust: 'backend/crates/domain/src/value_objects/single_line.rs::the_kernel_agrees_with_str_trim_at_100_and_500'
            - rust: 'backend/crates/domain/src/value_objects/single_line.rs::the_kernel_agrees_with_str_trim_near_the_limits'
            - rust: 'backend/crates/domain/src/value_objects/list_name.rs::list_name_limit_counts_code_points'
            - rust: 'backend/crates/domain/src/value_objects/list_name.rs::todo_title_limit_counts_code_points'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::accepts 500 emoji and never uses maxlength'
        'Too long':
          checks:
            - kani: 'backend/crates/domain/src/value_objects/single_line.rs::the_single_line_rule_trims_counts_code_points_and_refuses_line_breaks'
            - rust: 'backend/crates/domain/src/value_objects/single_line.rs::the_kernel_agrees_with_str_trim_near_the_limits'
            - rust: 'backend/crates/domain/src/value_objects/list_name.rs::list_name_limit_counts_code_points'
            - rust: 'backend/crates/domain/src/value_objects/list_name.rs::todo_title_limit_counts_code_points'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::keeps its text and names the limit for 501 characters'
        'Control characters sent to the server':
          checks:
            - kani: 'backend/crates/domain/src/value_objects/single_line.rs::the_single_line_rule_trims_counts_code_points_and_refuses_line_breaks'
            - rust: 'backend/crates/domain/src/value_objects/single_line.rs::refuses_control_characters_and_separators'
            - rust: 'backend/crates/server/tests/lists_integration.rs::blank_names_and_titles_are_400'
        'Pasted lines':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::turns pasted line breaks into spaces'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::turns line breaks pasted into a list name into spaces'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::turns line breaks pasted into the rename fields into spaces'
        'Markup in a title':
          checks:
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::shows markup in a title literally'
    'Lists and todos have limits':
      scenarios:
        'List limit':
          checks:
            - invariant: 'models/list_writes.qnt::listLimitHolds'
            - broken: 'models/list_writes.qnt::no_limit'
            - broken: 'models/list_writes.qnt::no_user_lock'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/server/tests/lists_integration.rs::list_limit_answers_409_and_names_the_limit'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_repeated_creation_key_returns_the_existing_list_also_at_the_limit'
        'Todo limit':
          checks:
            - invariant: 'models/list_writes.qnt::todoLimitHolds'
            - broken: 'models/list_writes.qnt::no_limit'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/server/tests/lists_integration.rs::todo_limit_answers_409_and_keeps_the_list_at_1000'
            - web: 'apps/web/src/lib/lists/engine.test.ts::removes an addition refused at the limit and keeps its text'
        'Room again after deleting':
          checks:
            - invariant: 'models/list_writes.qnt::listLimitHolds'
            - invariant: 'models/list_writes.qnt::todoLimitHolds'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::deleting_makes_room_again_at_both_limits'
        'Concurrent additions at the limit':
          checks:
            - invariant: 'models/list_writes.qnt::todoLimitHolds'
            - invariant: 'models/list_writes.qnt::listLimitHolds'
            - broken: 'models/list_writes.qnt::no_lock'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::concurrent_todo_additions_at_the_limit_save_one'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::concurrent_list_creation_at_the_limit_saves_one'
        'A full list stays usable':
          checks:
            - web: 'apps/web/tests/lists.spec.ts::adding, marking, renaming and reordering stay under 200 ms with 1,000 todos'
    'Edits made elsewhere are never silently overwritten':
      scenarios:
        'Renamed in two tabs':
          checks:
            - invariant: 'models/list_writes.qnt::staleChangesNothing'
            - invariant: 'models/list_writes.qnt::versionsMoveByOne'
            - broken: 'models/list_writes.qnt::no_version_check'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::two_todo_renames_at_one_version_apply_one'
            - web: 'apps/web/src/lib/lists/engine.test.ts::never overwrites a todo renamed elsewhere while the form was open'
            - web: 'apps/web/src/lib/lists/engine.test.ts::shows the current title on a stale rename and keeps the text'
            - web: 'apps/web/src/components/dashboard/ListsPanel.test.ts::shows the current title and a note when a rename changed elsewhere'
        'Renamed in one tab, marked done in another':
          checks:
            - invariant: 'models/list_writes.qnt::staleChangesNothing'
            - invariant: 'models/list_writes.qnt::versionsMoveByOne'
            - broken: 'models/list_writes.qnt::no_version_check'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_stale_mark_is_refused_with_the_current_row'
            - web: 'apps/web/src/lib/lists/engine.test.ts::shows the current row when a save is stale'
        'Marked done in both tabs':
          checks:
            - invariant: 'models/list_writes.qnt::versionsMoveByOne'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::two_marks_at_one_version_move_the_version_once'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_mark_already_in_place_succeeds_without_changing_the_version'
        'Deleting a todo renamed elsewhere':
          checks:
            - invariant: 'models/list_writes.qnt::staleChangesNothing'
            - broken: 'models/list_writes.qnt::no_version_check'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_todo_delete_is_refused_at_a_stale_version'
        'List renamed in two tabs':
          checks:
            - invariant: 'models/list_writes.qnt::staleChangesNothing'
            - invariant: 'models/list_writes.qnt::versionsMoveByOne'
            - broken: 'models/list_writes.qnt::no_version_check'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::two_list_renames_at_one_version_apply_one'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_stale_list_rename_is_refused_with_the_current_list'
            - web: 'apps/web/src/lib/lists/engine.test.ts::never overwrites a list renamed elsewhere while the form was open'
        'Different todos in two tabs':
          pending: '8.2'
          checks:
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::renaming_different_todos_does_not_conflict'
        'Moved in one tab, renamed in another':
          checks:
            - invariant: 'models/list_writes.qnt::movesKeepEveryTodoOnce'
            - invariant: 'models/list_writes.qnt::versionsMoveByOne'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::moves_never_change_a_version'
            - web: 'apps/web/src/lib/lists/regressions.test.ts::keeps a move beside a rename made elsewhere'
        'No version given':
          checks:
            - rust: 'backend/crates/server/tests/lists_integration.rs::adding_and_marking_todos_orders_them_and_answers_409_on_stale'
            - rust: 'backend/crates/server/tests/lists_integration.rs::renaming_and_deleting_lists_and_todos'
    'Changes to something deleted elsewhere are handled':
      scenarios:
        'Todo deleted elsewhere':
          pending: '8.2'
          checks:
            - web: 'apps/web/src/lib/lists/engine.test.ts::removes a todo deleted elsewhere'
            - web: 'apps/web/src/lib/lists/regressions.test.ts::undoes a failed move, and shows a todo completed or deleted elsewhere'
        'List deleted elsewhere':
          pending: '8.2'
          checks:
            - web: 'apps/web/src/lib/lists/engine.test.ts::shows list not found when a todo is deleted in a list deleted elsewhere'
            - web: 'apps/web/src/lib/lists/engine.test.ts::keeps every text queued on an addition whose list was deleted elsewhere'
            - web: 'apps/web/src/lib/lists/regressions.test.ts::drops every edit of a deleted list with one message and keeps the texts'
        'Deleted in both tabs':
          pending: '8.2'
          checks:
            - web: 'apps/web/src/lib/lists/engine.test.ts::deletes a todo at once, and a 404 counts as success'
    'Concurrent moves settle on one order':
      scenarios:
        'Different todos moved at once':
          checks:
            - invariant: 'models/list_writes.qnt::openPositionsAreUnique'
            - invariant: 'models/list_writes.qnt::movesKeepEveryTodoOnce'
            - broken: 'models/list_writes.qnt::no_lock'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::concurrent_moves_settle_on_one_order'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::concurrent_moves_adds_and_completions_keep_every_todo_once'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_move_waits_for_the_list_lock'
        'Same todo moved at once':
          checks:
            - invariant: 'models/list_writes.qnt::openPositionsAreUnique'
            - invariant: 'models/list_writes.qnt::movesKeepEveryTodoOnce'
            - broken: 'models/list_writes.qnt::no_lock'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::concurrent_moves_adds_and_completions_keep_every_todo_once'
        'Neighbour gone':
          checks:
            - kani: 'backend/crates/domain/src/entities/todo_order.rs::a_move_takes_the_slot_its_neighbours_name'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::neighbours_that_are_gone_done_or_foreign_are_ignored'
        'Moved todo was completed elsewhere':
          checks:
            - invariant: 'models/list_writes.qnt::movesKeepEveryTodoOnce'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_move_after_its_todo_was_completed_or_deleted_concurrently_changes_nothing'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_done_deleted_or_foreign_todo_does_not_move'
            - rust: 'backend/crates/application/src/use_cases/lists/move_todo.rs::moving_a_done_todo_is_stale'
            - web: 'apps/web/src/lib/lists/regressions.test.ts::undoes a failed move, and shows a todo completed or deleted elsewhere'
    'A repeated save takes effect once':
      scenarios:
        'Answer lost':
          checks:
            - invariant: 'models/list_writes.qnt::repeatStoresOneRow'
            - broken: 'models/list_writes.qnt::no_key_check'
            - replay: 'backend/crates/persistence-postgres/tests/model_conformance.rs::list_writes_follow_the_model'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::one_todo_key_sent_twice_at_once_saves_one_todo'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::one_list_key_sent_twice_at_once_saves_one_list'
            - web: 'apps/web/src/lib/lists/memory-server.test.ts::creates a new list for the key of a deleted list, as Postgres does'
            - rust: 'backend/crates/persistence-postgres/tests/lists_integration.rs::a_repeated_todo_key_returns_the_existing_todo_also_at_the_limit'
            - rust: 'backend/crates/server/tests/lists_integration.rs::a_repeated_creation_key_returns_one_list'
            - web: 'apps/web/src/lib/lists/engine.test.ts::refetches after an unknown addition outcome'
            - web: 'apps/web/tests/lists.spec.ts::a lost rename answer does not rename twice or show a failure'
        'Same title on purpose':
          {
            checks:
              [
                {
                  rust: 'backend/crates/server/tests/lists_integration.rs::the_same_title_added_twice_on_purpose_is_two_todos',
                },
              ],
          }
    'Lists follow the account through export and deletion':
      scenarios:
        'Export':
          checks:
            - rust: 'backend/crates/server/tests/export_lists_integration.rs::exports_open_and_done_todos_in_order'
            - rust: 'backend/crates/server/tests/export_lists_integration.rs::export_contains_only_the_callers_lists'
