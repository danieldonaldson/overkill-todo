[package]
name = "api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# No default features. `server` enables `swagger-ui` in dev and leaves it off in release.
swagger-ui = ["dep:utoipa-swagger-ui"]

[dependencies]
application = { path = "../application" }
domain = { path = "../domain" }
platform = { path = "../platform" }
shared = { path = "../shared" }

argon2.workspace = true
axum.workspace = true
base64.workspace = true
hmac.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-stream = "0.1"
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
urlencoding.workspace = true
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum.workspace = true
utoipa-swagger-ui = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
validator.workspace = true

[dev-dependencies]
application = { path = "../application", features = ["test-support"] }
platform = { path = "../platform", features = ["test-support"] }

opentelemetry_sdk = { workspace = true, features = ["testing"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tower.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
