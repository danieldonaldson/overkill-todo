[package]
name = "application"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = ["dep:serde_json", "dep:tracing-subscriber"]

[dependencies]
domain = { path = "../domain" }
shared = { path = "../shared" }
async-trait.workspace = true
hex.workspace = true
jiff = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"], optional = true }
utoipa.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
validator.workspace = true

[dev-dependencies]
domain = { path = "../domain", features = ["test-support"] }
mockall.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tracing-subscriber = { workspace = true, features = ["json"] }

[lints]
workspace = true
