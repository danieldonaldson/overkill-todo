# Configuration for `cargo deny` (run via `just deny` and in CI).
#
# This is the cargo-side analogue of the frontend's pnpm supply-chain policy
# (`PNPM_CONFIG_MINIMUM_RELEASE_AGE=1440`, see the justfile): it gates the dependency
# graph on license, source, and advisory policy rather than re-resolving freely.
#
# `cargo audit` (see .cargo/audit.toml) still owns the RustSec CVE scan; this adds
# license allow/deny, source bans, and duplicate detection on top of it.

[advisories]
version = 2
# RustSec advisory handling. Vulnerabilities and yanked crates deny by default.
# Keep this ignore list in sync with `.cargo/audit.toml` — every entry needs a
# justification and should be dropped the moment a fix is available.
ignore = [
    # RUSTSEC-2026-0173 — `proc-macro-error2` unmaintained. Build-time proc-macro
    # dependency of `validator_derive`; not in the runtime binary. Drop once
    # `validator` migrates off it.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
# Permissive / public-domain licenses only. Derived from the actual dependency
# graph (`cargo metadata`); adding a dependency under a license not listed here
# fails the check and forces a conscious policy decision.
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# Apache-2.0-with-LLVM-exception crates (e.g. wasi/rustix) also offer plain
# Apache-2.0 OR MIT, so no separate exception is required.

# The workspace crate itself (`app`, `publish = false`) carries no license
# field; skip license checks for first-party private crates rather than inventing one.
private = { ignore = true }

[bans]
# Duplicate versions are a warning (transitive graphs routinely carry a few);
# wildcard version requirements are denied for first-party deps but allowed for
# path/workspace crates.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io. Any git or alternate-registry dependency must be added here
# explicitly so an unreviewed source can't slip in.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
