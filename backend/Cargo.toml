[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = "1.48"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "timeout", "cors"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "json", "sqlx-toml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
# `parallel` runs the ARGON2_PARALLELISM lanes on separate threads (rayon);
# without it the lanes run one after another. Hash output is unchanged.
argon2 = { version = "0.6", features = ["parallel"] }
aes-gcm = "0.11"
uuid = "1.11"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
rand = "0.10"
base64 = "0.23"
urlencoding = "2.1"
validator = { version = "0.21", features = ["derive"] }
jiff = "1"
# sqlx has no jiff support of its own; sqlx.toml maps TIMESTAMPTZ to this wrapper.
jiff-sqlx = { version = "1", features = ["postgres"] }
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
http = "1"
config = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
# Process-wide TLS provider with post-quantum key exchange (crates/platform/src/tls.rs).
rustls = { version = "0.23", features = ["aws_lc_rs"] }
hickory-resolver = { version = "0.26", features = ["tokio"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "hostname", "builder"] }
utoipa = { version = "6", features = ["jiff_0_2", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
# Global allocator: secure mode hardens metadata (guard pages, encrypted free
# lists) at ~10% cost, and reduces fragmentation under our long-lived async load.
mimalloc = { version = "0.1", default-features = false, features = ["secure"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "metrics", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
opentelemetry-semantic-conventions = "0.33"
utoipa-axum = "0.3"

# Dev/test dependencies
mockall = "0.15"
proptest = "1.6"
wiremock = "0.6"
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
# Reads the Quint models' ITF traces for the conformance replay (`just models`).
itf = "0.4"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"

# Tuned for a smaller, faster production binary. `lto` + `codegen-units = 1`
# lengthen the *release* link/compile step but do not affect dev builds.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Optimise the password-hashing crates in dev/test builds too. Unoptimised Argon2
# at the production parameters takes ~3 s per hash, which made local logins,
# signups and code checks crawl. Our own code still builds at the dev opt-level.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
