[package]
name = "overkill-todo"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.cargo-machete]
# Not used by name: listed only to enable its `aws_lc_rs` feature for the rustls
# that reqwest pulls in. cargo-machete can't see feature-only dependencies.
ignored = ["rustls"]

[lib]
name = "overkill_todo"
path = "src/lib.rs"

[[bin]]
name = "overkill-todo"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.48", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "timeout", "cors"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
argon2 = "0.5"
aes-gcm = "0.11"
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.23"
urlencoding = "2.1"
validator = { version = "0.20", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
config = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
hickory-resolver = { version = "0.26", features = ["tokio"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "hostname", "builder"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
# Global allocator: secure mode hardens metadata (guard pages, encrypted free
# lists) at ~10% cost, and reduces fragmentation under our long-lived async load.
mimalloc = { version = "0.1", default-features = false, features = ["secure"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.15"
once_cell = "1.19"
proptest = "1.6"
wiremock = "0.6"
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }

# Criterion benches (`just bench`). `harness = false` hands `main` to criterion.
# They share `tests/common` with the integration tests for app wiring and keys.
[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "domain"
harness = false

[[bench]]
name = "middleware"
harness = false

# Full router against Postgres; skips itself when DATABASE_URL is unset.
[[bench]]
name = "http"
harness = false

[features]
mocks = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

# Tuned for a smaller, faster production binary. `lto` + `codegen-units = 1`
# lengthen the *release* link/compile step but do not affect dev builds.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
